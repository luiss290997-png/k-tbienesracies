<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de administración — K&T Bienes Raíces</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="robots" content="noindex" />
</head>
<body>
  <!-- Permite iniciar sesión con Netlify Identity -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <!-- El panel de edición (Decap CMS). Se usa una versión fija (en vez de
       "^3.0.0") para que el navegador no cargue de golpe una versión nueva
       sin avisar; si algún día hay que actualizar, se cambia aquí a mano. -->
  <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", (user) => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
  <!-- Vista previa de "Propiedades" con las fotos ya mostradas como
       imágenes, para que siempre se vea una vista previa aunque la
       miniatura del propio campo "Fotos" tarde en aparecer. -->
  <script>
    if (window.CMS && window.createClass && window.h) {
      var PropiedadesPreview = createClass({
        render: function () {
          var entry = this.props.entry;
          var getAsset = this.props.getAsset;
          var propiedades = entry.getIn(["data", "propiedades"]) || [];
          return h(
            "div",
            { style: { fontFamily: "sans-serif", padding: "16px" } },
            propiedades
              .map(function (prop, i) {
                var fotos = prop.get("fotos") || [];
                return h(
                  "div",
                  { key: i, style: { marginBottom: "28px" } },
                  h("h2", { style: { marginBottom: "4px" } }, prop.get("titulo") || "(sin título)"),
                  h(
                    "p",
                    { style: { color: "#666", marginTop: 0 } },
                    [prop.get("zona"), prop.get("tipo"), prop.get("operacion")].filter(Boolean).join(" · ")
                  ),
                  h(
                    "div",
                    { style: { display: "flex", flexWrap: "wrap", gap: "8px" } },
                    fotos
                      .map(function (foto, j) {
                        var path = foto.get("foto");
                        if (!path) return null;
                        var asset = getAsset(path);
                        return h("img", {
                          key: j,
                          src: asset ? asset.toString() : "",
                          style: {
                            width: "110px",
                            height: "110px",
                            objectFit: "cover",
                            borderRadius: "6px",
                            border: "1px solid #ddd",
                          },
                        });
                      })
                      .toArray()
                  )
                );
              })
              .toArray()
          );
        },
      });
      CMS.registerPreviewTemplate("listado", PropiedadesPreview);
    }
  </script>
</body>
</html>
